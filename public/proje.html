<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proje — Mehmet Rahbay Mimarlık</title>
<meta name="description" content="Mehmet Rahbay Mimarlık proje detayı.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'><rect width='128' height='128' rx='26' fill='%2315232f'/><g fill='none' stroke-width='11' stroke-linecap='square'><path d='M18 96V38l22 28 22-28v58' stroke='%23faf7f2'/><path d='M80 96V38h18a15 15 0 010 30H80' stroke='%23e08a4d'/><path d='M93 68l22 28' stroke='%23e08a4d'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="project">

<div id="preloader">
  <div class="pl-name" data-pl-name>Proje</div>
  <div class="pl-count"><span data-pl-count>0</span></div>
  <div class="pl-bar"></div>
</div>

<div id="transition"></div>

<header class="header solid">
  <div class="wrap">
    <a class="brand" href="/">
      <svg class="logo-svg" viewBox="0 0 128 128" role="img" aria-label="Mehmet Rahbay logosu">
        <path class="lg-m" d="M12 98 V32 L37 64 L62 32 V98"/>
        <path class="lg-r" d="M80 98 V32 H99 A16 16 0 0 1 99 64 H80"/>
        <path class="lg-r" d="M95 64 L118 98"/>
        <line class="lg-base" x1="12" y1="114" x2="118" y2="114"/>
      </svg>
      <span class="txt">
        <b data-brand-name>Mehmet Rahbay</b>
        <small data-brand-role>Mimarlık &amp; Tasarım</small>
      </span>
    </a>
    <nav class="nav">
      <a class="nav-link" href="/#projeler">Projeler</a>
      <a class="nav-link" href="/#hakkinda">Hakkında</a>
      <a class="nav-link" href="/#hizmetler">Hizmetler</a>
      <a class="btn-fill" href="/#iletisim">İletişim</a>
      <button class="burger" aria-label="Menü"><span></span><span></span></button>
    </nav>
  </div>
</header>

<div class="menu">
  <nav class="menu-links">
    <a href="/#projeler">Projeler</a>
    <a href="/#hakkinda">Hakkında</a>
    <a href="/#hizmetler">Hizmetler</a>
    <a href="/#surec">Süreç</a>
    <a href="/#iletisim">İletişim</a>
  </nav>
  <div class="menu-foot"><span data-menu-mail></span><span data-menu-phone></span><span data-menu-addr></span></div>
</div>

<main>
  <section class="pd-hero">
    <div class="wrap">
      <div class="eyebrow" data-pd-cat></div>
      <h1 class="display pd-title" data-pd-title style="margin-top:22px"></h1>
      <p class="lead reveal" data-d="1" style="margin-top:26px;max-width:52ch" data-pd-summary></p>
      <div class="pd-facts" data-pd-facts></div>
      <figure class="pd-cover img-clip" data-parallax="0.1"><img data-pd-cover src="" alt=""></figure>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="pd-body">
        <div class="txt" data-pd-desc></div>
        <aside class="side">
          <div class="eyebrow reveal" style="margin-bottom:20px">Öne çıkanlar</div>
          <div data-pd-features></div>
        </aside>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="gallery" data-pd-gallery></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="pd-nav" data-pd-nav></div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap">
    <span>© <span data-year></span> <span data-foot-name></span>. <span data-foot-note></span></span>
    <a href="/#projeler">Tüm projeler</a>
    <a class="to-top" href="#" data-top>Yukarı ↑</a>
  </div>
</footer>

<script src="/js/main.js"></script>
</body>
</html>
