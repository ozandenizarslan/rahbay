<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mehmet Rahbay — Mimarlık & Tasarım Ofisi</title>
<meta name="description" content="Mehmet Rahbay Mimarlık: konut, kültür ve ofis yapıları üzerine çalışan; sadeliği, oranı ve malzemenin dürüstlüğünü esas alan bir tasarım ofisi.">
<meta property="og:title" content="Mehmet Rahbay — Mimarlık & Tasarım Ofisi">
<meta property="og:description" content="Işığın, oranın ve malzemenin birlikte çalıştığı kalıcı yapılar.">
<meta property="og:image" content="/uploads/hero.jpg">
<meta name="theme-color" content="#15232f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'><rect width='128' height='128' rx='26' fill='%2315232f'/><g fill='none' stroke-width='11' stroke-linecap='square'><path d='M18 96V38l22 28 22-28v58' stroke='%23faf7f2'/><path d='M80 96V38h18a15 15 0 010 30H80' stroke='%23e08a4d'/><path d='M93 68l22 28' stroke='%23e08a4d'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="preloader">
  <div class="pl-name" data-pl-name>Mehmet Rahbay</div>
  <div class="pl-count"><span data-pl-count>0</span></div>
  <div class="pl-bar"></div>
</div>

<div id="transition"></div>

<header class="header">
  <div class="wrap">
    <a class="brand" href="/">
      <svg class="logo-svg" viewBox="0 0 128 128" role="img" aria-label="Mehmet Rahbay logosu">
        <path class="lg-m" d="M12 98 V32 L37 64 L62 32 V98"/>
        <path class="lg-r" d="M80 98 V32 H99 A16 16 0 0 1 99 64 H80"/>
        <path class="lg-r" d="M95 64 L118 98"/>
        <line class="lg-base" x1="12" y1="114" x2="118" y2="114"/>
      </svg>
      <span class="txt">
        <b data-brand-name>Mehmet Rahbay</b>
        <small data-brand-role>Mimarlık &amp; Tasarım</small>
      </span>
    </a>
    <nav class="nav">
      <a class="nav-link" href="#projeler">Projeler</a>
      <a class="nav-link" href="#hakkinda">Hakkında</a>
      <a class="nav-link" href="#hizmetler">Hizmetler</a>
      <a class="nav-link" href="#surec">Süreç</a>
      <a class="btn-fill" href="#iletisim">İletişim</a>
      <button class="burger" aria-label="Menü"><span></span><span></span></button>
    </nav>
  </div>
</header>

<div class="menu">
  <nav class="menu-links">
    <a href="#projeler">Projeler</a>
    <a href="#hakkinda">Hakkında</a>
    <a href="#hizmetler">Hizmetler</a>
    <a href="#surec">Süreç</a>
    <a href="#iletisim">İletişim</a>
  </nav>
  <div class="menu-foot">
    <span data-menu-mail></span><span data-menu-phone></span><span data-menu-addr></span>
  </div>
</div>

<main>
  <!-- ---------------------------------------------------------- HERO -->
  <section class="hero">
    <div class="wrap">
      <div class="hero-inner">
        <div class="hero-title">
          <div class="eyebrow hero-eyebrow" data-hero-eyebrow></div>
          <h1 class="display" data-hero-title></h1>
        </div>
        <figure class="hero-media" data-parallax="0.12">
          <img data-hero-img src="" alt="Mehmet Rahbay Mimarlık — seçilmiş proje">
        </figure>
        <div class="hero-meta">
          <p class="lead" data-hero-sub></p>
          <div class="hero-actions">
            <a class="btn-fill" href="#projeler" data-hero-cta>Projeleri gör</a>
            <span class="scroll-hint mono"><span class="bar"></span><span data-hero-hint>Kaydır</span></span>
          </div>
        </div>
      </div>
    </div>
    <div class="marquee"><div class="marquee-track" data-marquee></div><div class="marquee-track" data-marquee aria-hidden="true"></div></div>
  </section>

  <!-- ------------------------------------------------------ HAKKINDA -->
  <section class="section" id="hakkinda">
    <div class="wrap">
      <div class="about-grid">
        <figure class="about-media img-clip reveal" data-parallax="0.09">
          <img data-about-img src="" alt="Ofis iç mekânı">
        </figure>
        <div class="about-text">
          <div class="eyebrow reveal" data-about-eyebrow></div>
          <h2 class="h2 mask-up"><span data-about-title></span></h2>
          <div data-about-body></div>
          <div class="signature reveal" data-about-sign></div>
        </div>
      </div>
      <div class="stats" data-stats></div>
    </div>
  </section>

  <!-- ------------------------------------------------------- PROJELER -->
  <section class="section" id="projeler">
    <div class="wrap">
      <div class="section-head">
        <div class="eyebrow reveal" data-proj-eyebrow></div>
        <h2 class="h2 mask-up"><span data-proj-title></span></h2>
        <p class="muted txt reveal" data-d="1" data-proj-text></p>
      </div>
      <div class="projects" data-projects></div>
    </div>
  </section>

  <!-- ------------------------------------------------------ HİZMETLER -->
  <section class="section" id="hizmetler">
    <div class="wrap">
      <div class="section-head">
        <div class="eyebrow reveal" data-serv-eyebrow></div>
        <h2 class="h2 mask-up"><span data-serv-title></span></h2>
      </div>
      <div class="services" data-services></div>
    </div>
  </section>

  <!-- ---------------------------------------------------------- SÜREÇ -->
  <section class="section" id="surec">
    <div class="wrap">
      <div class="section-head">
        <div class="eyebrow reveal" data-proc-eyebrow></div>
        <h2 class="h2 mask-up"><span data-proc-title></span></h2>
      </div>
      <div class="steps" data-steps></div>
    </div>
  </section>

  <!-- ------------------------------------------------------- İLETİŞİM -->
  <section class="section contact" id="iletisim">
    <div class="wrap">
      <div class="contact-grid">
        <div class="contact-main">
          <div class="eyebrow reveal" data-cont-eyebrow></div>
          <h2 class="h2 mask-up" style="margin-top:22px"><span data-cont-title></span></h2>
          <p class="lead reveal" data-d="1" style="margin-top:22px;max-width:44ch;color:#c6d0d7" data-cont-text></p>
          <a class="big-link reveal" data-d="2" data-cont-mail href="#"></a>
        </div>
        <div class="contact-side" data-cont-side></div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap">
    <span>© <span data-year></span> <span data-foot-name></span>. <span data-foot-note></span></span>
    <a href="/admin/">Yönetim paneli</a>
    <a class="to-top" href="#" data-top>Yukarı ↑</a>
  </div>
</footer>

<script src="/js/main.js"></script>
</body>
</html>
