# Render kurulum dosyası — Render bu dosyayı görünce ayarları otomatik yapar.
services:
  - type: web
    name: mehmet-rahbay
    runtime: node
    plan: free
    region: frankfurt          # Türkiye/KKTC'ye en yakın bölge
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SESSION_SECRET
        generateValue: true    # Render rastgele güvenli bir anahtar üretir
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false            # Render panelinden kendi şifrenizi girersiniz

      # --------------------------------------------------------------
      # CLOUDFLARE R2 — yüklenen görsellerin ve panel değişikliklerinin
      # kalıcı olmasını sağlar. Değerleri Render panelinden girin.
      # Beşi birden girilmezse sistem otomatik olarak yerel kipe döner.
      # --------------------------------------------------------------
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
